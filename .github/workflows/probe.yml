name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FAA runway files
        run: |
          mkdir -p out && cd out
          curl -sL "https://nfdc.faa.gov/webContent/28DaySub/extra/29_Oct_2026_APT_CSV.zip" -o apt.zip
          unzip -o -q apt.zip && ls -la > report.txt
          for f in APT_RWY.csv APT_RWY_END.csv APT_BASE.csv; do
            echo "===== $f $(wc -l < $f)" >> report.txt
            head -1 $f >> report.txt
            grep -E '"(LGA|MSP)"' $f | head -12 >> report.txt
          done
          touch cycles.txt zips.txt
      - name: Publish report
        run: |
          cd out
          git init -q -b ci-probe && git config user.name laia-ci && git config user.email laia-ci@users.noreply.github.com
          git add report.txt cycles.txt zips.txt && git commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-probe
