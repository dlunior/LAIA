name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FAA NASR CSV
        run: |
          set -x
          mkdir -p out && cd out
          page=$(curl -sL "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/")
          echo "$page" | grep -oE 'NASR_Subscription/[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u > cycles.txt
          cat cycles.txt
          cur=$(curl -sL "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/2026-10-29")
          echo "$cur" | grep -oE 'https?://[^"]+\.zip' | sort -u > zips.txt
          cat zips.txt
          url=$(grep -i "CSV" zips.txt | grep -iv "change" | head -1)
          echo "CSV URL: $url" > report.txt
          curl -sL "$url" -o nasr.zip
          ls -la nasr.zip >> report.txt
          unzip -l nasr.zip >> report.txt
          mkdir x && cd x && unzip -q ../nasr.zip
          find . -name "*.zip" -exec unzip -q -o {} \; 2>/dev/null || true
          for f in $(find . -iname "FRQ*.csv" -o -iname "APT_BASE.csv" -o -iname "ATC_BASE.csv" -o -iname "ATC_ATIS.csv" -o -iname "ATC_SVC.csv" -o -iname "COM.csv" -o -iname "ARB*.csv" -o -iname "AFF*.csv"); do
            echo "===== $f ($(wc -l < $f) lines)" >> ../report.txt
            head -3 "$f" >> ../report.txt
            grep -E '"?LGA"?,|LA GUARDIA|"KLGA"' "$f" | head -25 >> ../report.txt
          done
          find . -iname "*.csv" | sort >> ../report.txt
      - name: Publish report
        run: |
          cd out
          git init -q -b ci-probe && git config user.name laia-ci && git config user.email laia-ci@users.noreply.github.com
          git add report.txt cycles.txt zips.txt && git commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-probe
