name: Build LAIA Collector

on:
  push:
    branches: [main]
    paths:
      - "src/Laia.Collector/**"
      - "src/Laia.Server/TrafficCore/**"
      - "src/Laia.Common/**"
      - "Directory.Build.props"
      - ".github/workflows/collector.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Laia.Collector/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/dlunior/laia-collector:latest
            ghcr.io/dlunior/laia-collector:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/dlunior/LAIA
            org.opencontainers.image.title=LAIA Collector
            org.opencontainers.image.description=Collects real airline tracks near US and Canadian airports for LAIA
