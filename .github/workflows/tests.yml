name: Traffic tests (branches)

# Work in progress on a branch: the offline traffic tests only — no installers, no release, so nothing reaches the
# "Update LAIA" button until it's merged into main.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      LAIA_DIAG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the server and LAIA Sim (catches compile errors before a merge)
        shell: pwsh
        run: |
          dotnet build src/Laia.Server -c Release -v q
          if ($LASTEXITCODE) { throw "server build failed" }
          dotnet build src/Laia.Sim -c Release -v q
          if ($LASTEXITCODE) { throw "LAIA Sim build failed" }
          dotnet build src/Laia.Collector -c Release -v q
          if ($LASTEXITCODE) { throw "LAIA Collector build failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a small route model (the training script end to end, on the processor)
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python learning/test_train_routes.py --out "$env:RUNNER_TEMP\laia-test-model.json"
          if ($LASTEXITCODE) { throw "route model training failed" }
          "LAIA_TEST_MODEL=$env:RUNNER_TEMP\laia-test-model.json" >> $env:GITHUB_ENV
      - name: Check traffic logic (offline simulation)
        shell: pwsh
        run: |
          dotnet run --project src/Laia.Tests -c Release *>&1 | Tee-Object -FilePath traffic-tests.log
          if ($LASTEXITCODE) { throw "traffic checks failed" }
