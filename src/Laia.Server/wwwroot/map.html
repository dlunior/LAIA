<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAIA Live Map</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0b1020;--panel:#121a2e;--panel2:#18223a;--line:#24314f;--text:#e8eefc;--muted:#8d9bbb;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sim:#7c8aa8;--dep:#fb923c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  #map{position:absolute;inset:0;background:#0a0f1c}
  .panel{position:absolute;z-index:1000;top:12px;left:12px;width:320px;max-height:calc(100% - 24px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
  .card{pointer-events:auto;background:linear-gradient(180deg,rgba(24,34,58,.96),rgba(18,26,46,.96));border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .head{display:flex;align-items:center;gap:10px}
  .head img{width:28px;height:28px;border-radius:7px}
  .head h1{font-size:16px;margin:0;font-weight:600}
  .head a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px}
  .muted{color:var(--muted)}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
  .toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .toggles label{font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
  .toggles input{accent-color:var(--accent);margin:0}
  button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #sel h2{margin:0;font-size:17px;display:flex;align-items:baseline;gap:8px}
  #sel h2 small{font-size:12px;color:var(--muted);font-weight:400}
  dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13px}
  dt{color:var(--muted)} dd{margin:0}
  #listCard{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
  #list{overflow:auto;min-height:0}
  #list .row{display:grid;grid-template-columns:10px 82px 1fr auto;gap:8px;align-items:center;padding:4px 2px;border-bottom:1px solid rgba(36,49,79,.6);cursor:pointer;font-size:12.5px}
  #list .row:hover{background:rgba(56,189,248,.06)}
  #list .row.on{background:rgba(56,189,248,.12)}
  .cs{font-weight:600}
  .ph{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{font-variant-numeric:tabular-nums;color:var(--muted)}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .ac-label{background:transparent;border:0;box-shadow:none;color:var(--text);font-size:11px;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;padding:0}
  .ac-label .l2{font-weight:400;color:#c7d2ea}
  .leaflet-tooltip.ac-label:before{display:none}
  .rwy-label{background:rgba(11,16,32,.8);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:600;border-radius:5px;padding:0 4px}
  .leaflet-tooltip.rwy-label:before{display:none}
  .lim-label{background:rgba(11,16,32,.85);border:1px solid var(--warn);color:var(--warn);font-size:10.5px;border-radius:4px;padding:0 3px}
  .leaflet-tooltip.lim-label:before{display:none}
  .leaflet-container{font:inherit;background:#0a0f1c}
  .leaflet-control-attribution{background:rgba(11,16,32,.7)!important;color:var(--muted)!important}
  .leaflet-control-attribution a{color:#9fb4dd!important}
  @media (max-width:640px){.panel{width:calc(100% - 24px);max-height:48%}#list{display:none}.panel.open #list{display:block}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <div class="card">
    <div class="head"><img src="/logo.png" alt=""><h1>LAIA Live Map</h1><a href="/">Control page ›</a></div>
    <div class="sub" id="status">Connecting…</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--warn)"></i>You</span>
      <span><i class="sw" style="background:var(--accent)"></i>Drawn in the sim</span>
      <span><i class="sw" style="background:var(--sim)"></i>Simulated, not drawn</span>
      <span><i class="sw" style="background:var(--sim);width:7px;height:7px;border-radius:50%"></i>Rest of the sky (on schedule)</span>
      <span title="Click an aircraft"><i style="display:inline-block;width:16px;border-top:2px solid var(--warn)"></i>Flown</span>
      <span title="Click an aircraft"><i style="display:inline-block;width:16px;border-top:2px dashed #fff"></i>Upcoming</span>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="tRing" checked>Drawing range</label>
      <label><input type="checkbox" id="tRwy" checked>Runways</label>
      <label><input type="checkbox" id="tLabels" checked>Labels</label>
      <label><input type="checkbox" id="tAllPaths">All routes</label>
      <label><input type="checkbox" id="tFollow">Follow me</label>
      <label><input type="checkbox" id="tSky" checked>Whole sky</label>
      <label><input type="checkbox" id="tReal">Real tracks</label>
      <label title="Satellite fields' real tracks: arrivals amber, departures pink"><input type="checkbox" id="tRealSat" checked>…satellites too</label>
      <label title="The planned direction of each one-way stretch of taxiway: violet arrivals, teal departures, white both; solid from real taxi tracks, dashed worked out from the layout"><input type="checkbox" id="tFlow">Taxi flow</label>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px"><button id="bAirport">Airport</button><button id="bMe">Me</button><button id="bList">Flights</button><button id="bReplay" title="Play back what LAIA's traffic flew (its own track recording)">Replay</button></div>
  </div>
  <div class="card" id="rpCard" hidden>
    <div class="tag" style="margin-bottom:6px">Replay — LAIA's own track recording</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input type="datetime-local" id="rpFrom" step="60" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px">
      <select id="rpLen" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px;font:inherit;font-size:12px"><option value="1800">30 min</option><option value="3600" selected>1 hour</option><option value="7200">2 hours</option><option value="10800">3 hours</option></select>
      <button id="rpLoad">Load</button><button id="rpExit">Back to live</button>
    </div>
    <div id="rpCtl" hidden style="margin-top:8px">
      <input type="range" id="rpSlider" min="0" max="1000" value="0" style="width:100%;accent-color:var(--accent)">
      <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
        <button id="rpPlay">Play</button>
        <select id="rpSpeed" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px;font:inherit;font-size:12px"><option value="1">×1</option><option value="5">×5</option><option value="10" selected>×10</option><option value="30">×30</option><option value="60">×60</option></select>
        <span id="rpTime" class="num" style="margin-left:auto"></span>
      </div>
      <label class="sub" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="rpTrails" checked>Trails (3 min) and instruction markers</label>
    </div>
    <div class="sub" id="rpStatus"></div>
  </div>
  <div class="card" id="sel" hidden></div>
  <div class="card" id="seqCard"><div class="tag" style="margin-bottom:4px">Arrival sequence</div><div id="seq"></div></div>
  <div class="card" id="listCard"><div class="tag" style="margin-bottom:4px">Flights <span id="count"></span></div><div id="list"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const COLORS = { user: "#fbbf24", drawn: "#38bdf8", sim: "#7c8aa8", path: "#38bdf8", landing: "#34d399", departing: "#fb923c", both: "#a78bfa", idle: "#56607a" };
const NM = 1852;

const map = L.map("map", { zoomControl: true, attributionControl: true, preferCanvas: false }).setView([40.7769, -73.874], 11);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2job_1_9208e4eed8ce81033c5c07eb", {
  subdomains: "abcd", maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const layers = { flow: L.layerGroup().addTo(map), real: L.layerGroup().addTo(map), rwy: L.layerGroup().addTo(map), ring: L.layerGroup().addTo(map), paths: L.layerGroup().addTo(map), sel: L.layerGroup().addTo(map), ac: L.layerGroup().addTo(map) };
const markers = new Map();      // id -> marker
const skyRenderer = L.canvas({ padding: .3 });
const skyLayer = L.layerGroup().addTo(map);
const skyMarkers = new Map();   // id -> circle marker (the rest of the sky: many, so drawn on a canvas)
let sky = [], skyAt = 0;
let lastListHtml = "";
let userMarker = null, selected = null, data = null, centred = false, lastRwyKey = "", pathTimer = 0;

function planeIcon(color, hdg, size) {
  const s = size || 22;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" style="transform:rotate(${hdg}deg);filter:drop-shadow(0 0 2px #000)">
    <path d="M12 2c.8 0 1.3.8 1.3 1.8V9l7.7 4.6v2l-7.7-2.3v4.5l2.2 1.7v1.5L12 20l-3.5 1v-1.5l2.2-1.7v-4.5L3 15.6v-2L10.7 9V3.8C10.7 2.8 11.2 2 12 2z" fill="${color}" stroke="#0b1020" stroke-width=".8"/></svg>`;
  return L.divIcon({ html: svg, className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
}

function fmtAlt(f) { if (f.ground) return "ground"; const a = Math.round(f.alt / 100); return a >= 180 ? "FL" + a : Math.round(f.alt).toLocaleString() + " ft"; }
function phaseText(f) {
  const p = f.phase;
  const map = { "taxi in": "taxiing in", "landing roll": "landing roll", "takeoff roll": "takeoff roll", "lined up": "lined up", "holding short": "holding short", "lining up": "lining up", "at gate": "at the gate", "engine start": "engine start", pushback: "pushing back", boarding: "boarding", parked: "parked", climbing: "climbing", arriving: "arriving", approach: "approach", final: "final", flare: "landing", "go-around": "going around", taxi: "taxiing out" };
  return map[p] || p;
}
function colorFor(f) { return f.drawn ? COLORS.drawn : COLORS.sim; }

function labelHtml(f) {
  const l2 = f.ground ? `${f.type} · ${phaseText(f)}` : `${Math.round(f.alt / 100).toString().padStart(3, "0")} · ${f.gs} kt`;
  return `${f.cs}<br><span class="l2">${l2}</span>`;
}

// Each aircraft's icon and label are only rebuilt when they change, and only for aircraft in view (user, 21 Nov: the
// map lagged zoomed in at KATL at Peak — every second every aircraft's icon and label were thrown away and rebuilt).
// A heading change just turns the existing icon.
function updateAircraft(list) {
  const seen = new Set();
  const showLabels = $("tLabels").checked;
  const view = map.getBounds().pad(0.2);
  for (const f of list) {
    if (f.kind === "parked" && f.phase === "parked") continue;   // parked aircraft only clutter the map
    seen.add(f.id);
    let m = markers.get(f.id);
    const col = f.id === selected ? "#ffffff" : colorFor(f), size = f.ground ? 18 : 22;
    const inView = view.contains([f.lat, f.lon]);
    if (!m) {
      if (!inView) continue;
      m = L.marker([f.lat, f.lon], { icon: planeIcon(col, f.hdg, size), keyboard: false }).addTo(layers.ac);
      m.on("click", () => select(f.id));
      m._laia = { col, size, hdg: f.hdg, label: "" };
      markers.set(f.id, m);
    } else {
      if (!inView) { layers.ac.removeLayer(m); markers.delete(f.id); continue; }
      m.setLatLng([f.lat, f.lon]);
      const st = m._laia;
      if (st.col !== col || st.size !== size) { m.setIcon(planeIcon(col, f.hdg, size)); st.col = col; st.size = size; st.hdg = f.hdg; if (m.getTooltip()) { m.unbindTooltip(); st.label = ""; } }
      else if (Math.abs(st.hdg - f.hdg) >= 2) {
        const svg = m.getElement()?.querySelector("svg");
        if (svg) svg.style.transform = `rotate(${f.hdg}deg)`;
        st.hdg = f.hdg;
      }
    }
    if (showLabels) {
      const lh = labelHtml(f);
      if (!m.getTooltip()) { m.bindTooltip(lh, { permanent: true, direction: "right", offset: [10, 0], className: "ac-label" }); m._laia.label = lh; }
      else if (m._laia.label !== lh) { m.setTooltipContent(lh); m._laia.label = lh; }
    } else if (m.getTooltip()) { m.unbindTooltip(); m._laia.label = ""; }
  }
  for (const [id, m] of markers) if (!seen.has(id)) { layers.ac.removeLayer(m); markers.delete(id); }
  if (showLabels) declutter(list);
}

// Labels never on top of each other (user: a queue for the runway at ORD, each label over the next): each is put to
// the right of its aircraft, else below, above or to the left — whichever is free — and left out (the aircraft still
// shows, its label on a click) when none is. The selected aircraft first, then the airborne ones, then the moving.
function declutter(list) {
  const byId = new Map(list.map(f => [f.id, f]));
  const items = [];
  for (const [id, m] of markers) {
    const t = m.getTooltip(), el = t && t.getElement(), f = byId.get(id);
    if (!el || !f) continue;
    const p = map.latLngToContainerPoint(m.getLatLng());
    const w = 7 * Math.max(String(f.cs || "").length, (f.ground ? `${f.type} · ${phaseText(f)}` : "000 · 000 kt").length * 0.85) + 4, h = 28;
    const rank = id === selected ? 0 : !f.ground ? 1 : (f.gs || 0) > 3 ? 2 : 3;
    items.push({ el, p, w, h, rank });
  }
  items.sort((a, b) => a.rank - b.rank);
  const placed = [];
  const hit = r => placed.some(q => r.x < q.x + q.w && q.x < r.x + r.w && r.y < q.y + q.h && q.y < r.y + r.h);
  // Each aircraft's own icon is taken too, so a label never covers another aircraft.
  for (const it of items) placed.push({ x: it.p.x - 8, y: it.p.y - 8, w: 16, h: 16 });
  for (const it of items) {
    const opts = [[0, 0], [0, 24], [0, -24], [-(it.w + 22), 0]];
    let done = false;
    for (const [dx, dy] of opts) {
      const r = { x: it.p.x + 10 + dx, y: it.p.y - it.h / 2 + dy, w: it.w, h: it.h };
      if (hit(r) && it.rank > 0) continue;
      placed.push(r);
      it.el.style.marginLeft = dx + "px"; it.el.style.marginTop = dy + "px"; it.el.style.visibility = "";
      done = true; break;
    }
    if (!done) it.el.style.visibility = "hidden";
  }
}

function updateUser(u) {
  if (!u) { if (userMarker) { layers.ac.removeLayer(userMarker); userMarker = null; } return; }
  const icon = planeIcon(COLORS.user, u.hdg, 26);
  if (!userMarker) {
    userMarker = L.marker([u.lat, u.lon], { icon, zIndexOffset: 1000 }).addTo(layers.ac)
      .bindTooltip(() => `You${u.callsign ? " · " + u.callsign : ""}`, { direction: "right", offset: [12, 0], className: "ac-label" });
  } else { userMarker.setLatLng([u.lat, u.lon]); userMarker.setIcon(icon); }
  if ($("tFollow").checked) map.panTo([u.lat, u.lon], { animate: true });
}

function updateRunways(rw) {
  const key = JSON.stringify((rw || []).map(r => r.ident + r.use));
  if (key === lastRwyKey) return;
  lastRwyKey = key;
  layers.rwy.clearLayers();
  if (!rw || !$("tRwy").checked) return;
  const done = new Set();
  for (const r of rw) {
    const pair = [r.thr, r.end].map(p => p.map(x => x.toFixed(5)).join(",")).sort().join("|");
    const other = rw.find(o => o !== r && [o.thr, o.end].map(p => p.map(x => x.toFixed(5)).join(",")).sort().join("|") === pair);
    const use = r.use || (other && other.use) || null;
    if (!done.has(pair)) {
      done.add(pair);
      const c = use ? (use.includes("landing") && use.includes("depart") ? COLORS.both : use.includes("landing") ? COLORS.landing : COLORS.departing) : COLORS.idle;
      L.polyline([r.thr, r.end], { color: c, weight: use ? 6 : 4, opacity: use ? .95 : .6, lineCap: "butt" }).addTo(layers.rwy);
    }
    L.marker(r.thr, { opacity: 0, keyboard: false, interactive: false }).addTo(layers.rwy)
      .bindTooltip(r.ident + (r.use ? " · " + r.use : ""), { permanent: true, direction: "center", className: "rwy-label" });
  }
}

function updateRing(d) {
  layers.ring.clearLayers();
  if (!$("tRing").checked || !d.user) return;
  L.circle([d.user.lat, d.user.lon], { radius: d.drawRadiusNm * NM, color: COLORS.user, weight: 1, opacity: .45, fill: false, dashArray: "6 6" }).addTo(layers.ring);
}

function fmtEta(s) { s = Math.round(s); return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min` : s >= 60 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : `${s} s`; }

function detailsHtml(f) {
  const rows = [
    ["Aircraft", `${f.type}${f.title ? ` <span class="muted">· ${f.title.replace(/^AIGAIM_/, "")}</span>` : ""}`],
    ["Registration", f.reg || "—"],
    [f.kind === "arrival" ? "From" : f.kind === "departure" ? "To" : "Route", f.other || "—"],
    ["Phase", phaseText(f)],
    ["Altitude", fmtAlt(f)],
    ["Speed", `${f.ias} kt IAS · ${f.gs} kt ground`],
    ["Runway", f.runway || "—"],
    ["Procedure", f.route || "—"],
    ["Gate", f.gate || "—"],
    ["Wake category", f.wake],
    ["Drawn in the sim", f.drawn ? "yes" : "no (simulated only)"],
  ];
  if (f.dth != null) rows.splice(5, 0, ["To the runway", `${f.dth} nm`]);
  if (f.fixes && f.fixes.length) rows.splice(6, 0, ["Next fixes", f.fixes.map(x => `${x.fix} ${new Date(Date.now() + x.eta * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} (${fmtEta(x.eta)})`).join(" · ")]);
  if (f.etd != null) rows.splice(6, 0, ["Takes off in", `${fmtEta(f.etd)} (${new Date(Date.now() + f.etd * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })})${f.depSeq ? ` · number ${f.depSeq} for ${f.runway}` : ""}`]);
  if (f.eta != null) rows.splice(6, 0, ["Lands in", `${fmtEta(f.eta)} (${new Date(Date.now() + f.eta * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })})${f.seq ? ` · number ${f.seq} for ${f.runway}` : ""}`]);
  return `<h2>${f.cs} <small>${f.airline}</small></h2>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button id="bZoomSel">Zoom to it</button>${f.user ? "" : `<button id="bRemove" title="Take this aircraft out of the sim (for one that's stuck)">Remove</button>`}<button id="bClose">Close</button></div>`;
}

function findSel(id) { return (data && data.flights.find(x => x.id === id)) || sky.find(x => x.id === id); }

function skyDetailsHtml(f) {
  const rows = [
    ["Aircraft", `${f.type}${f.title ? ` <span class="muted">· ${f.title.replace(/^AIGAIM_/, "")}</span>` : ""}`],
    ["Registration", f.reg || "—"],
    ["Route", `${f.dep} → ${f.arr}`],
    ["Phase", f.phase],
    ["Altitude", f.alt >= 18000 ? "FL" + Math.round(f.alt / 100) : f.alt.toLocaleString() + " ft"],
    ["Cruise level", "FL" + Math.round(f.cruise / 100)],
    ["Ground speed", `${f.gs} kt`],
    ["Lands in", f.eta >= 60 ? `${Math.floor(f.eta / 60)} h ${f.eta % 60} min` : `${f.eta} min`],
    ["Drawn in the sim", f.why ? `no — ${f.why}` : "no (flying on its schedule)"],
  ];
  return `<h2>${f.cs} <small>${f.airline}</small></h2>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <div style="margin-top:8px;display:flex;gap:6px"><button id="bZoomSel">Zoom to it</button><button id="bClose">Close</button></div>`;
}

// Real tracks learned from adsb.lol (M6), drawn faintly under LAIA's traffic to compare: arrivals violet, departures teal.
// All of them as two lines on one canvas (user, 15 Nov: "the map performance is rough with the learned track turned
// on" — hundreds of separate lines, rebuilt every minute), and only redrawn when the tracks themselves change.
let realAt = 0, realKey = "";
const realCanvas = L.canvas({ padding: 0.3 });
async function updateReal() {
  if (!$("tReal").checked) { layers.real.clearLayers(); realAt = 0; realKey = ""; return; }
  if (Date.now() - realAt < 60000) return;
  realAt = Date.now();
  try {
    const r = await fetch("/api/map/real", { cache: "no-store" });
    if (!r.ok) { layers.real.clearLayers(); realKey = ""; return; }
    const d = await r.json();
    if (d.key === realKey) return;
    realKey = d.key;
    layers.real.clearLayers();
    // Satellite fields' real tracks in their own colours: arrivals amber, departures pink.
    const arr = [], dep = [], sArr = [], sDep = [];
    const sats = $("tRealSat").checked;
    for (const t of d.tracks) {
      if (t.sat && !sats) continue;
      (t.sat ? (t.kind === "arrival" ? sArr : sDep) : (t.kind === "arrival" ? arr : dep)).push(t.points);
    }
    const opt = { renderer: realCanvas, weight: 1.2, opacity: .35, interactive: false, smoothFactor: 1.5 };
    if (arr.length) L.polyline(arr, { ...opt, color: "#a78bfa" }).addTo(layers.real);
    if (dep.length) L.polyline(dep, { ...opt, color: "#2dd4bf" }).addTo(layers.real);
    if (sArr.length) L.polyline(sArr, { ...opt, color: "#f59e0b" }).addTo(layers.real);
    if (sDep.length) L.polyline(sDep, { ...opt, color: "#f472b6" }).addTo(layers.real);
  } catch { }
}

// The taxi flow (one-way stretches worked out from the layout for the runways in use), with arrows.
let flowAt = 0, flowKey = "";
const flowCanvas = L.canvas({ padding: 0.3 });
async function updateFlow() {
  if (!$("tFlow").checked) { layers.flow.clearLayers(); flowAt = 0; flowKey = ""; return; }
  if (Date.now() - flowAt < 20000) return;
  flowAt = Date.now();
  try {
    const r = await fetch("/api/map/flow", { cache: "no-store" });
    if (!r.ok) { layers.flow.clearLayers(); return; }
    const d = await r.json();
    if (d.key + d.stretches.length === flowKey) return;
    flowKey = d.key + d.stretches.length;
    layers.flow.clearLayers();
    // Lighter (user, 16 Nov: "are the taxi ADSB data optimized for the live map like the arrivals and departures?"):
    // the stretches as six lines on a canvas (by use, and real or worked out) instead of one each, and an arrow about
    // every 300 m of a stretch instead of on every short piece — O'Hare's 400-odd stretches had thousands of arrows.
    const groups = new Map();
    for (const st of d.stretches) {
      const k = st.use + "|" + (st.real ? 1 : 0);
      if (!groups.has(k)) groups.set(k, { use: st.use, real: st.real, lines: [] });
      groups.get(k).lines.push(st.points);
    }
    for (const g of groups.values()) {
      const col = g.use === "departures" ? "#2dd4bf" : g.use === "arrivals" ? "#a78bfa" : "#e5e7eb";
      // Solid: decided by real taxi tracks; dashed: worked out from the layout.
      L.polyline(g.lines, { renderer: flowCanvas, color: col, weight: 3, opacity: .55, dashArray: g.real ? null : "6 6", interactive: false }).addTo(layers.flow);
    }
    for (const st of d.stretches) {
      const col = st.use === "departures" ? "#2dd4bf" : st.use === "arrivals" ? "#a78bfa" : "#e5e7eb";
      // Arrows as small chevrons on the canvas (were a page element each: hundreds at a big airport).
      const arrow = (a, b) => {
        const k = 111320, cl = Math.cos(a[0] * Math.PI / 180);
        const dy = (b[0] - a[0]) * k, dx = (b[1] - a[1]) * k * cl, len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len, m0 = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], sz = 18;
        const pt = (fx, fy) => [m0[0] + fy / k, m0[1] + fx / (k * cl)];
        const tip = pt(ux * sz, uy * sz), l1 = pt(-uy * sz * 0.7 - ux * sz * 0.4, ux * sz * 0.7 - uy * sz * 0.4), r1 = pt(uy * sz * 0.7 - ux * sz * 0.4, -ux * sz * 0.7 - uy * sz * 0.4);
        L.polyline([l1, tip, r1], { renderer: flowCanvas, color: col, weight: 2.5, opacity: .9, interactive: false }).addTo(layers.flow);
      };
      let run = 150, placed = false;   // the first arrow 150 m in, then every 300 m; at least one per stretch
      for (let i = 0; i + 1 < st.points.length; i++) {
        const [a, b] = [st.points[i], st.points[i + 1]];
        run -= Math.hypot((b[0] - a[0]) * 111320, (b[1] - a[1]) * 111320 * Math.cos(a[0] * Math.PI / 180));
        if (run > 0) continue;
        run = 300; placed = true;
        arrow(a, b);
      }
      if (!placed && st.points.length >= 2) { const m = Math.floor((st.points.length - 1) / 2); arrow(st.points[m], st.points[m + 1]); }
    }
  } catch { }
}

// En-route flights LAIA draws in the sim (user, 15 Nov: "I thought grey dots weren't injected into the sim, yet they
// show on my TCAS"): shown like the other drawn aircraft — a plane in the drawn colour with its label — not as a grey dot.
const skyDrawn = new Map();
function updateSky() {
  const show = $("tSky").checked;
  const seen = new Set(), seenDrawn = new Set();
  const showLabels = $("tLabels").checked;
  if (show) for (const f of sky) {
    if (f.drawn) {
      seenDrawn.add(f.id);
      const icon = planeIcon(f.id === selected ? "#ffffff" : COLORS.drawn, f.hdg, 22);
      let d = skyDrawn.get(f.id);
      if (!d) { d = L.marker([f.lat, f.lon], { icon, keyboard: false }).addTo(layers.ac); d.on("click", () => select(f.id)); skyDrawn.set(f.id, d); }
      else { d.setLatLng([f.lat, f.lon]); d.setIcon(icon); }
      const lbl = `${f.cs}<br><span class="l2">${Math.round(f.alt / 100).toString().padStart(3, "0")} · ${f.gs} kt · ${f.dep}→${f.arr}</span>`;
      if (showLabels) { if (!d.getTooltip()) d.bindTooltip(lbl, { permanent: true, direction: "right", offset: [10, 0], className: "ac-label" }); else d.setTooltipContent(lbl); }
      else if (d.getTooltip()) d.unbindTooltip();
      continue;
    }
    seen.add(f.id);
    let m = skyMarkers.get(f.id);
    const on = f.id === selected;
    if (!m) {
      m = L.circleMarker([f.lat, f.lon], { renderer: skyRenderer, radius: 3, weight: 1, color: "#0b1020", fillColor: COLORS.sim, fillOpacity: .9 }).addTo(skyLayer);
      m.on("click", e => { L.DomEvent.stopPropagation(e); select(f.id); });
      m.bindTooltip("", { direction: "right", offset: [6, 0], className: "ac-label" });
      skyMarkers.set(f.id, m);
    } else m.setLatLng([f.lat, f.lon]);
    m.setStyle({ radius: on ? 5 : 3, fillColor: on ? "#ffffff" : COLORS.sim });
    m.setTooltipContent(`${f.cs}<br><span class="l2">${f.type} · ${f.dep}→${f.arr} · ${Math.round(f.alt / 100).toString().padStart(3, "0")}</span>`);
  }
  for (const [id, m] of skyMarkers) if (!seen.has(id)) { skyLayer.removeLayer(m); skyMarkers.delete(id); }
  for (const [id, d] of skyDrawn) if (!seenDrawn.has(id)) { layers.ac.removeLayer(d); skyDrawn.delete(id); }
}

function select(id) {
  selected = id;
  layers.sel.clearLayers();
  const f = findSel(id);
  if (!f) { $("sel").hidden = true; selected = null; return; }
  renderSel(f);
  drawPath(true);
  render();
}

function renderSel(f) {
  $("sel").hidden = false;
  $("sel").innerHTML = f.dep !== undefined ? skyDetailsHtml(f) : detailsHtml(f);
  $("bClose").onclick = () => { selected = null; $("sel").hidden = true; layers.sel.clearLayers(); render(); };
  $("bZoomSel").onclick = () => map.setView([f.lat, f.lon], f.dep !== undefined ? 8 : f.ground ? 15 : 11);
  // Remove (user, 20 Nov: for a stuck aircraft): a second click within 4 s confirms.
  if ($("bRemove")) {
    let armed = 0;
    $("bRemove").onclick = async () => {
      const b = $("bRemove");
      if (Date.now() - armed > 4000) { armed = Date.now(); b.textContent = `Remove ${f.cs}? Click again`; return; }
      b.disabled = true; b.textContent = "Removing…";
      try {
        const r = await fetch(`/api/traffic/remove/${encodeURIComponent(f.id)}`, { method: "POST" });
        const d = await r.json();
        b.textContent = d.message || (d.ok ? "Removed." : "Couldn't remove it.");
        if (d.ok) setTimeout(() => { selected = null; $("sel").hidden = true; layers.sel.clearLayers(); render(); }, 1200);
      } catch { b.textContent = "Couldn't reach the server."; b.disabled = false; }

  }
}

async function drawPath(force) {
  if (!selected) return;
  const isSky = selected.startsWith("net-");
  if (!force && Date.now() - pathTimer < (isSky ? 10000 : 2000)) return; // a great circle barely changes
  pathTimer = Date.now();
  try {
    const r = await fetch(isSky ? `/api/map/net/${encodeURIComponent(selected)}` : `/api/map/path/${encodeURIComponent(selected)}`, { cache: "no-store" });
    if (!r.ok) return;
    const p = await r.json();
    if (p.id !== selected) return;
    layers.sel.clearLayers();
    // Flown: solid amber line behind it. Upcoming: dashed white line ahead.
    if (p.flown && p.flown.length > 1) L.polyline(p.flown, { color: "#fbbf24", weight: p.ground ? 3 : 2.5, opacity: .85 }).addTo(layers.sel);
    L.polyline(p.points, { color: "#ffffff", weight: p.ground ? 3 : 2.5, opacity: .9, dashArray: "8 6" }).addTo(layers.sel);
    for (const l of p.limits || [])
      L.circleMarker([l.lat, l.lon], { radius: 4, color: COLORS.user, weight: 2, fillOpacity: .3 }).addTo(layers.sel)
        .bindTooltip(`≤ ${Math.round(l.kt)} kt`, { permanent: true, direction: "top", offset: [0, -4], className: "lim-label" });
  } catch { }
}

let allPathsAt = 0;
async function drawAllPaths() {
  if (!$("tAllPaths").checked) { layers.paths.clearLayers(); return; }
  if (Date.now() - allPathsAt < 5000) return;
  allPathsAt = Date.now();
  const ids = (data?.flights || []).filter(f => f.drawn && !(f.kind === "parked" && f.phase === "parked")).map(f => f.id).slice(0, 40);
  const results = await Promise.all(ids.map(id => fetch(`/api/map/path/${encodeURIComponent(id)}`, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)));
  layers.paths.clearLayers();
  for (const p of results) if (p) L.polyline(p.points, { color: COLORS.path, weight: 1.5, opacity: .45, dashArray: p.ground ? null : "6 6" }).addTo(layers.paths);
}

// Against its landing slot (the constant traffic manager): green within 30 s, amber to 90 s, red beyond.
function slotTag(f) {
  if (f.slotdev == null) return "";
  const d = f.slotdev, a = Math.abs(d);
  const col = a <= 30 ? "#4caf50" : a <= 90 ? "#ffb300" : "#e53935";
  const txt = a <= 30 ? "on slot" : `${a >= 90 ? Math.round(a / 60) + " min" : a + " s"} ${d > 0 ? "late" : "early"}`;
  return ` · <span style="color:${col}">${txt}</span>`;
}

function renderSeq() {
  const arr = (data?.flights || []).filter(f => f.kind === "arrival" && f.eta != null && f.seq);
  const by = {};
  for (const f of arr) (by[f.runway || "?"] ||= []).push(f);
  const rw = Object.keys(by).sort();
  $("seq").innerHTML = rw.length === 0 ? '<div class="ph">No arrivals yet</div>' : rw.map(r => `<div class="tag" style="margin:6px 0 2px">Runway ${r}</div>` +
    by[r].sort((a, b) => a.seq - b.seq).slice(0, 12).map(f => `<div class="row${f.id === selected ? " on" : ""}" data-id="${f.id}">
      <span class="cs">${f.seq}. ${f.cs}</span>
      <span class="ph">${Math.round(f.eta / 60)} min${f.gapnm != null ? ` · ${f.gapnm} nm behind` : ""}${f.mgr ? ` · ${f.mgr}` : ""}${slotTag(f)}</span>
      <span class="num">${Math.round(f.alt / 100).toString().padStart(3, "0")}</span></div>`).join("")).join("");
  for (const row of $("seq").querySelectorAll(".row")) row.onclick = () => { select(row.dataset.id); const f = data.flights.find(x => x.id === row.dataset.id); if (f) map.panTo([f.lat, f.lon]); };
}

function renderList() {
  if (!$("panel").classList.contains("open") && window.innerWidth <= 640) return;   // hidden: nothing to rebuild
  const fl = (data?.flights || []).filter(f => !(f.kind === "parked" && f.phase === "parked"))
    .sort((a, b) => (b.drawn - a.drawn) || (a.kind > b.kind ? 1 : -1) || a.cs.localeCompare(b.cs));
  $("count").textContent = `(${fl.length} moving, ${(data?.flights || []).length - fl.length} parked)`;
  const html = fl.map(f => `<div class="row${f.id === selected ? " on" : ""}" data-id="${f.id}">
      <i class="sw" style="background:${colorFor(f)}"></i><span class="cs">${f.cs}</span>
      <span class="ph">${f.type} · ${phaseText(f)}${f.runway ? " · " + f.runway : ""}${f.eta != null ? ` · #${f.seq} in ${Math.round(f.eta / 60)}m` : ""}${f.depSeq ? ` · #${f.depSeq} for departure` : ""}${f.etd != null ? ` · off in ${Math.round(f.etd / 60)}m` : ""}</span>
      <span class="num">${f.ground ? f.gs + " kt" : Math.round(f.alt / 100).toString().padStart(3, "0")}</span></div>`).join("");
  if (html === lastListHtml) return;   // unchanged: the page isn't rebuilt
  lastListHtml = html;
  $("list").innerHTML = html;
  for (const row of $("list").querySelectorAll(".row")) row.onclick = () => { select(row.dataset.id); const f = data.flights.find(x => x.id === row.dataset.id); if (f) map.panTo([f.lat, f.lon]); };
}

// ---- Replay of LAIA's own track recording (/api/tracks/range): aircraft, 3-minute trails and the instructions
// they were given, as markers where they were given. Click an aircraft for its whole flight and every instruction.
const rp = { on: false, tracks: new Map(), events: [], t0: 0, t1: 0, t: 0, playing: false, last: 0, sel: null, markers: new Map() };
layers.rp = L.layerGroup().addTo(map); layers.rpTrail = L.layerGroup().addTo(map); layers.rpSel = L.layerGroup().addTo(map);
function rpFmt(t) { return new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function rpEnter() {
  rp.on = true; $("rpCard").hidden = false;
  layers.ac.clearLayers(); markers.clear(); layers.sel.clearLayers(); layers.paths.clearLayers(); $("sel").hidden = true; selected = null;
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  if (!$("rpFrom").value) { const d = new Date(Date.now() - 3600e3); d.setSeconds(0, 0); $("rpFrom").value = new Date(d.getTime() - d.getTimezoneOffset() * 60e3).toISOString().slice(0, 16); }
}
function rpExit() {
  rp.on = false; rp.playing = false; $("rpCard").hidden = true; $("rpCtl").hidden = true;
  layers.rp.clearLayers(); layers.rpTrail.clearLayers(); layers.rpSel.clearLayers(); rp.markers.clear(); rp.sel = null; $("sel").hidden = true;
  render();
}
async function rpLoad() {
  const from = new Date($("rpFrom").value).getTime() / 1000, len = +$("rpLen").value;
  if (!from) return;
  $("rpStatus").textContent = "Loading…";
  try {
    const r = await fetch(`/api/tracks/range?from=${from}&to=${from + len}&every=5`, { cache: "no-store" });
    const lines = await r.json();
    rp.tracks = new Map(); rp.events = [];
    for (const l of lines) {
      if (l.f) for (const a of l.f) {
        const key = l.w + " " + a[0];
        let tr = rp.tracks.get(key);
        if (!tr) rp.tracks.set(key, tr = { cs: a[0], type: a[1], kind: a[2], w: l.w, pts: [] });
        tr.pts.push({ t: l.t, lat: a[3], lon: a[4], alt: a[5], gs: a[6], hdg: a[7], phase: a[8], rwy: a[9], seq: a[10], leader: a[11] });
      } else if (l.e) rp.events.push({ t: l.t, w: l.w, cs: l.e[0], lat: l.e[1], lon: l.e[2], alt: l.e[3], text: l.e[4] });
    }
    for (const tr of rp.tracks.values()) tr.pts.sort((a, b) => a.t - b.t);
    rp.events.sort((a, b) => a.t - b.t);
    const ts = [...rp.tracks.values()].flatMap(tr => [tr.pts[0].t, tr.pts[tr.pts.length - 1].t]);
    if (!ts.length) { $("rpStatus").textContent = "Nothing recorded then (the recording starts with version 0.1.319, while the sim is connected)."; $("rpCtl").hidden = true; return; }
    rp.t0 = Math.min(...ts); rp.t1 = Math.max(...ts); rp.t = rp.t0;
    $("rpCtl").hidden = false;
    $("rpStatus").textContent = `${rp.tracks.size} aircraft, ${rp.events.length} instructions and events · ${rpFmt(rp.t0)} – ${rpFmt(rp.t1)}`;
    rpDraw();
  } catch { $("rpStatus").textContent = "Couldn't load the recording."; }
}
// Where an aircraft was at time t (between two recorded points), or null when it wasn't flying then.
function rpAt(tr, t) {
  const p = tr.pts;
  if (t < p[0].t || t > p[p.length - 1].t + 6) return null;
  let lo = 0, hi = p.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p[m].t <= t) lo = m; else hi = m; }
  const a = p[lo], b = p[Math.min(hi, p.length - 1)];
  if (b.t - a.t > 30 || b.t <= a.t || t >= b.t) return t - a.t > 30 ? null : (t >= b.t ? b : a);
  const k = (t - a.t) / (b.t - a.t);
  let dh = ((b.hdg - a.hdg + 540) % 360) - 180;
  return { ...a, lat: a.lat + (b.lat - a.lat) * k, lon: a.lon + (b.lon - a.lon) * k, alt: a.alt + (b.alt - a.alt) * k, gs: a.gs + (b.gs - a.gs) * k, hdg: (a.hdg + dh * k + 360) % 360 };
}
function rpColor(tr) { return tr.kind === "user" ? COLORS.user : tr.kind === "departure" ? COLORS.departing : tr.kind === "arrival" ? COLORS.drawn : COLORS.sim; }
function rpDraw() {
  if (!rp.on) return;
  const t = rp.t;
  $("rpTime").textContent = rpFmt(t);
  $("rpSlider").value = Math.round(1000 * (t - rp.t0) / Math.max(1, rp.t1 - rp.t0));
  const view = map.getBounds().pad(0.3), seen = new Set(), trails = $("rpTrails").checked;
  layers.rpTrail.clearLayers();
  for (const [key, tr] of rp.tracks) {
    const p = rpAt(tr, t);
    if (!p || !view.contains([p.lat, p.lon])) continue;
    seen.add(key);
    const col = key === rp.sel ? "#ffffff" : rpColor(tr);
    let m = rp.markers.get(key);
    const html = `${tr.cs}<br><span class="l2">${Math.round(p.alt / 100) >= 180 ? "FL" + Math.round(p.alt / 100) : Math.round(p.alt).toLocaleString()} · ${Math.round(p.gs)} kt${p.rwy ? " · " + p.rwy + (p.seq ? " #" + p.seq : "") : ""}</span>`;
    if (!m) {
      m = L.marker([p.lat, p.lon], { icon: planeIcon(col, p.hdg, p.phase === "ground" || p.alt < 50 ? 18 : 22) }).addTo(layers.rp);
      m.on("click", e => { L.DomEvent.stopPropagation(e); rp.sel = key; rpSelDraw(); rpDraw(); });
      m.bindTooltip(html, { permanent: $("tLabels").checked, direction: "right", offset: [10, 0], className: "ac-label" });
      rp.markers.set(key, m);
    } else {
      m.setLatLng([p.lat, p.lon]); m.setIcon(planeIcon(col, p.hdg, p.alt < 50 ? 18 : 22)); m.setTooltipContent(html);
    }
    if (trails) {
      const tp = tr.pts.filter(q => q.t >= t - 180 && q.t <= t).map(q => [q.lat, q.lon]);
      tp.push([p.lat, p.lon]);
      if (tp.length > 1) L.polyline(tp, { color: rpColor(tr), weight: 1.5, opacity: .7, interactive: false }).addTo(layers.rpTrail);
    }
  }
  for (const [key, m] of rp.markers) if (!seen.has(key)) { layers.rp.removeLayer(m); rp.markers.delete(key); }
  if (trails)
    for (const e of rp.events) {
      if (e.t > t) break;
      if (e.t < t - 180 || !view.contains([e.lat, e.lon])) continue;
      L.circleMarker([e.lat, e.lon], { radius: 4, color: COLORS.user, weight: 1, fillOpacity: .9 }).bindTooltip(`${e.cs} · ${rpFmt(e.t)}<br>${e.text}`, { direction: "top" }).addTo(layers.rpTrail);
    }
}
function rpSelDraw() {
  layers.rpSel.clearLayers();
  const tr = rp.tracks.get(rp.sel);
  if (!tr) { $("sel").hidden = true; return; }
  L.polyline(tr.pts.map(q => [q.lat, q.lon]), { color: "#ffffff", weight: 2.5, opacity: .9 }).addTo(layers.rpSel);
  const evs = rp.events.filter(e => e.cs === tr.cs && e.w === tr.w);
  for (const e of evs) L.circleMarker([e.lat, e.lon], { radius: 5, color: "#ffffff", fillColor: COLORS.user, weight: 1.5, fillOpacity: 1 })
    .bindTooltip(`${rpFmt(e.t)} · ${Math.round(e.alt).toLocaleString()} ft<br>${e.text}`, { direction: "top" }).on("click", ev => { L.DomEvent.stopPropagation(ev); rp.t = e.t; rpDraw(); }).addTo(layers.rpSel);
  const esc = x => String(x).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  $("sel").hidden = false;
  $("sel").innerHTML = `<h2>${esc(tr.cs)} <small>${esc(tr.type)} · ${esc(tr.kind)} · ${esc(tr.w)}</small></h2>
    <div class="sub">Recorded ${rpFmt(tr.pts[0].t)} – ${rpFmt(tr.pts[tr.pts.length - 1].t)}. Click an instruction to jump there.</div>
    <div style="max-height:260px;overflow:auto;margin-top:6px;font-size:12px">${evs.map((e, i) => `<div class="rpEv" data-i="${i}" style="padding:3px 0;border-bottom:1px solid rgba(36,49,79,.6);cursor:pointer"><span class="num">${new Date(e.t * 1000).toLocaleTimeString()}</span> ${esc(e.text)}</div>`).join("") || '<div class="muted">No instructions recorded.</div>'}</div>
    <div style="margin-top:8px;display:flex;gap:6px"><button id="rpZoom">Zoom to its flight</button><button id="rpClose">Close</button></div>`;
  $("sel").querySelectorAll(".rpEv").forEach(d => d.onclick = () => { const e = evs[+d.dataset.i]; rp.t = e.t; map.panTo([e.lat, e.lon]); rpDraw(); });
  $("rpZoom").onclick = () => map.fitBounds(L.polyline(tr.pts.map(q => [q.lat, q.lon])).getBounds().pad(0.1));
  $("rpClose").onclick = () => { rp.sel = null; layers.rpSel.clearLayers(); $("sel").hidden = true; rpDraw(); };
}
function rpTick(now) {
  if (rp.on && rp.playing) {
    const dt = Math.min(1, (now - (rp.last || now)) / 1000);
    rp.t = Math.min(rp.t1, rp.t + dt * +$("rpSpeed").value);
    if (rp.t >= rp.t1) { rp.playing = false; $("rpPlay").textContent = "Play"; }
    if (now - (rp.drawn || 0) > 200) { rp.drawn = now; rpDraw(); }
  }
  rp.last = now;
  requestAnimationFrame(rpTick);
}
requestAnimationFrame(rpTick);
$("bReplay").onclick = () => rp.on ? rpExit() : rpEnter();
$("rpLoad").onclick = rpLoad;
$("rpExit").onclick = rpExit;
$("rpPlay").onclick = () => { rp.playing = !rp.playing; $("rpPlay").textContent = rp.playing ? "Pause" : "Play"; };
$("rpSlider").oninput = () => { rp.t = rp.t0 + (rp.t1 - rp.t0) * $("rpSlider").value / 1000; rpDraw(); };
$("rpTrails").onchange = rpDraw;
map.on("moveend", () => { if (rp.on) rpDraw(); });

function render() {
  if (!data) return;
  if (rp.on) { updateRunways(data.runways); return; }
  updateRunways(data.runways);
  updateRing(data);
  updateAircraft(data.flights);
  updateUser(data.user);
  updateSky();
  updateReal();
  updateFlow();
  renderList();
  renderSeq();
  if (selected) { const f = findSel(selected); if (f) renderSel(f); else { selected = null; $("sel").hidden = true; layers.sel.clearLayers(); } }
}

async function poll() {
  try {
    // The rest of the sky moves slowly and can be a lot of flights: fetched every 4 seconds.
    const wantSky = $("tSky").checked && Date.now() - skyAt > 4000;
    const r = await fetch(wantSky ? "/api/map?sky=1" : "/api/map", { cache: "no-store" });
    data = await r.json();
    if (data.net) { sky = data.net; skyAt = Date.now(); }
    const a = data.airport;
    const moving = data.flights.filter(f => !(f.kind === "parked" && f.phase === "parked")).length;
    $("status").textContent = a ? `${a.icao} ${a.name} · ${moving} moving, ${data.flights.length} in all · level ${data.level}${data.approach ? " · " + data.approach : ""}${data.peak ? " · peak test" : ""}${sky.length ? ` · ${sky.length} more in the sky nearby` : ""}${data.user ? "" : " · MSFS not connected"}`
      : (data.user ? "No traffic airport near you yet" : "Waiting for MSFS");
    if (!centred && (a || data.user)) { centred = true; map.setView(a ? [a.lat, a.lon] : [data.user.lat, data.user.lon], 11); }
    render();
    drawPath(false);
    drawAllPaths();
  } catch { $("status").textContent = "Can't reach the LAIA Server — retrying…"; }
  setTimeout(poll, 1000);
}

$("bAirport").onclick = () => { if (data?.airport) map.setView([data.airport.lat, data.airport.lon], 12); };
$("bMe").onclick = () => { if (data?.user) map.setView([data.user.lat, data.user.lon], 12); };
$("bList").onclick = () => $("panel").classList.toggle("open");
$("tRwy").onchange = () => { lastRwyKey = ""; render(); };
$("tRing").onchange = render;
$("tLabels").onchange = render;
$("tSky").onchange = () => { skyAt = 0; if (!$("tSky").checked) sky = []; render(); };
$("tAllPaths").onchange = () => { allPathsAt = 0; drawAllPaths(); };
$("tRealSat").onchange = () => { realAt = 0; realKey = ""; updateReal(); };
map.on("moveend", () => { if (data) updateAircraft(data.flights); });
map.on("click", () => { if (selected) { selected = null; $("sel").hidden = true; layers.sel.clearLayers(); render(); } });
poll();
</script>
</body>
</html>
